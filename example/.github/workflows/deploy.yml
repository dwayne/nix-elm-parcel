name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    #
    # Manual dispatch can run from any branch; only deploy from master or main.
    #
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy.yml
    permissions:
      contents: write
